[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-week10"
version = "0.1.0"
description = "Week 10 priority queues, cost-aware search and guided RRT"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["ap_week10*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

